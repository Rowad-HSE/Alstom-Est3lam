<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Induction Search System</title>

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      font-family: 'Cairo', Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #f0f2f5;
      color: #333;
    }

    /* ================================
       HEADER
    ================================= */

    .header {
      background: linear-gradient(
        135deg,
        #1e3c72 0%,
        #2a5298 100%
      );

      color: white;

      padding: 30px 20px;

      text-align: center;

      box-shadow:
        0 4px 6px rgba(0,0,0,0.1);
    }

    .header h1 {
      margin: 0;

      font-size: 32px;

      font-weight: 700;

      letter-spacing: 1px;
    }

    .header p {
      margin: 10px 0 0;

      color: #e2e8f0;

      font-size: 16px;
    }

    /* ================================
       CONTAINER
    ================================= */

    .container {

      max-width: 1200px;

      margin: 40px auto;

      padding: 0 20px;
    }

    /* ================================
       SEARCH BOX
    ================================= */

    .search-box {

      background: white;

      border-radius: 12px;

      padding: 30px;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.05);

      max-width: 600px;

      margin: 0 auto 40px auto;
    }

    .search-title {

      font-size: 22px;

      font-weight: 700;

      margin-bottom: 25px;

      color: #1e3c72;

      text-align: center;

      border-bottom:
        2px solid #f0f2f5;

      padding-bottom: 15px;
    }

    /* ================================
       FILTERS
    ================================= */

    .filters {

      display: flex;

      flex-direction: column;

      gap: 20px;
    }

    .field label {

      display: block;

      font-size: 15px;

      font-weight: 600;

      margin-bottom: 8px;

      color: #4a5568;
    }

    input,
    select {

      width: 100%;

      padding: 14px;

      border:
        1px solid #cbd5e0;

      border-radius: 8px;

      background: #f8fafc;

      font-size: 15px;

      outline: none;

      transition:
        all 0.3s ease;
    }

    input:focus,
    select:focus {

      border-color: #2a5298;

      background: #ffffff;

      box-shadow:
        0 0 0 3px
        rgba(42,82,152,0.15);
    }

    select[multiple] {

      min-height: 120px;

      padding: 8px;
    }

    .hint {

      font-size: 12px;

      color: #718096;

      margin-top: 6px;
    }

    /* ================================
       BUTTONS
    ================================= */

    .buttons {

      margin-top: 30px;

      display: flex;

      gap: 15px;
    }

    button {

      border: none;

      border-radius: 8px;

      padding: 14px 24px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
        all 0.3s ease;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;
    }

    .search-btn {

      background: #2a5298;

      color: white;

      flex: 2;
    }

    .search-btn:hover {

      background: #1e3c72;

      transform:
        translateY(-2px);
    }

    .clear-btn {

      background: #edf2f7;

      color: #4a5568;

      flex: 1;
    }

    .clear-btn:hover {

      background: #e2e8f0;

      color: #1a202c;
    }

    /* ================================
       RESULTS HEADER
    ================================= */

    .results-header {

      margin: 0 0 20px;

      font-size: 22px;

      font-weight: 700;

      color: #2d3748;

      text-align: center;

      position: relative;
    }

    .results-header::after {

      content: '';

      display: block;

      width: 60px;

      height: 4px;

      background: #2a5298;

      margin: 10px auto 0;

      border-radius: 2px;
    }

    /* ================================
       RESULTS
    ================================= */

    .results {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(320px, 1fr)
        );

      gap: 25px;
    }

    /* ================================
       WORKER CARD
    ================================= */

    .card {

      background: white;

      border-radius: 12px;

      overflow: hidden;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.05);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

      border:
        1px solid #e2e8f0;
    }

    .card:hover {

      transform:
        translateY(-5px);

      box-shadow:
        0 12px 25px
        rgba(0,0,0,0.1);
    }

    /* ================================
       PHOTO
    ================================= */

    .photo-container {

      width: 100%;

      height: 250px;

      background: #edf2f7;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      position: relative;
    }

    .photo-container img {

      width: 100%;

      height: 100%;

      object-fit: cover;
    }

    .no-photo {

      color: #a0aec0;

      font-size: 16px;

      font-weight: 600;
    }

    /* ================================
       CARD BODY
    ================================= */

    .card-body {

      padding: 20px;
    }

    .worker-name {

      font-size: 20px;

      font-weight: 700;

      margin-bottom: 15px;

      color: #1a202c;

      text-align: center;
    }

    .info-row {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 10px 0;

      border-bottom:
        1px dashed #e2e8f0;

      font-size: 14px;
    }

    .info-row:last-child {

      border-bottom: none;
    }

    .info-label {

      color: #718096;

      font-weight: 600;
    }

    .info-value {

      font-weight: 700;

      color: #2d3748;

      text-align: left;

      background: #f8fafc;

      padding: 4px 10px;

      border-radius: 6px;
    }

    /* ================================
       MESSAGE
    ================================= */

    .message {

      text-align: center;

      padding: 40px;

      color: #718096;

      background: white;

      border-radius: 12px;

      font-size: 18px;

      font-weight: 600;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.05);
    }

    /* ================================
       LOADING
    ================================= */

    .loading {

      display: none;

      text-align: center;

      padding: 20px;

      color: #2a5298;

      font-weight: 700;

      font-size: 16px;

      margin-top: 15px;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      .container {

        margin-top: 20px;
      }

      .search-box {

        padding: 20px;

        border-radius: 8px;
      }

      .header h1 {

        font-size: 24px;
      }

      .buttons {

        flex-direction: column;
      }

    }

  </style>

</head>

<body>

  <!-- ================================
       HEADER
  ================================= -->

  <div class="header">

    <h1>
      Induction System
    </h1>

    <p>
      نظام البحث عن بيانات العاملين
    </p>

  </div>


  <div class="container">

    <!-- ================================
         SEARCH BOX
    ================================= -->

    <div class="search-box">

      <div class="search-title">
        🔎 البحث عن العامل
      </div>


      <div class="filters">

        <!-- CODE -->

        <div class="field">

          <label>
            رقم الكود (Code)
          </label>

          <input
            type="text"
            id="code"
            placeholder="اكتب كود العامل هنا..."
          >

        </div>


        <!-- COMPANY -->

        <div class="field">

          <label>
            الشركة (Company)
          </label>

          <select
            id="company"
            multiple
          ></select>

          <div class="hint">

            اضغط Ctrl لاختيار أكثر من شركة في نفس الوقت

          </div>

        </div>


        <!-- CATEGORY -->

        <div class="field">

          <label>
            التصنيف الوظيفي
          </label>

          <select id="category">

            <option value="">
              كل التصنيفات
            </option>

          </select>

        </div>

      </div>


      <!-- BUTTONS -->

      <div class="buttons">

        <button
          class="search-btn"
          onclick="searchWorkers()"
        >

          🔍 بحث

        </button>


        <button
          class="clear-btn"
          onclick="clearSearch()"
        >

          مسح

        </button>

      </div>


      <!-- LOADING -->

      <div
        class="loading"
        id="loading"
      >

        جاري البحث، يرجى الانتظار...

      </div>

    </div>


    <!-- RESULTS HEADER -->

    <div
      class="results-header"
      id="resultsHeader"
      style="display:none;"
    >

      نتائج البحث

    </div>


    <!-- RESULTS -->

    <div
      id="results"
      class="results"
    ></div>

  </div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzRgoXzAms5G4WYHd0SYgrN8FTWSDgGsBeasoeoinclrRxumFqxCO9328PUSTxeZ0TB/exec';


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener('load', function() {

  loadFilters();

});


/* =====================================================
   LOAD FILTERS
===================================================== */

function loadFilters() {

  showMessage('جاري تحميل البيانات...');

  fetch(
    API_URL + '?action=filters',
    {
      method: 'GET',
      cache: 'no-cache'
    }
  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        'HTTP Error: ' + response.status
      );

    }

    return response.json();

  })

  .then(function(result) {

    if (!result.success) {

      throw new Error(
        result.error ||
        'حدث خطأ في تحميل البيانات'
      );

    }

    loadCompanies(
      result.data.companies || []
    );

    loadCategories(
      result.data.categories || []
    );

    clearResults();

  })

  .catch(function(error) {

    console.error(
      'Filter Error:',
      error
    );

    showMessage(
      'حدث خطأ أثناء تحميل البيانات: ' +
      error.message
    );

  });

}


/* =====================================================
   LOAD COMPANIES
===================================================== */

function loadCompanies(companies) {

  const select =
    document.getElementById('company');

  select.innerHTML = '';

  companies.forEach(function(company) {

    const option =
      document.createElement('option');

    option.value =
      company;

    option.textContent =
      company;

    select.appendChild(option);

  });

}


/* =====================================================
   LOAD CATEGORIES
===================================================== */

function loadCategories(categories) {

  const select =
    document.getElementById('category');

  select.innerHTML =
    '<option value="">كل التصنيفات</option>';

  categories.forEach(function(category) {

    const option =
      document.createElement('option');

    option.value =
      category;

    option.textContent =
      category;

    select.appendChild(option);

  });

}


/* =====================================================
   SEARCH WORKERS
===================================================== */

function searchWorkers() {

  const code =
    document
      .getElementById('code')
      .value
      .trim();


  const companySelect =
    document.getElementById('company');


  const companies =
    Array
      .from(
        companySelect.selectedOptions
      )
      .map(function(option) {

        return option.value;

      });


  const category =
    document
      .getElementById('category')
      .value;


  /* -----------------------------------------------
     VALIDATION
  ------------------------------------------------ */

  if (
    !code &&
    companies.length === 0 &&
    !category
  ) {

    showMessage(
      'من فضلك اكتب Code أو اختار شركة أو تصنيف وظيفي لبدء البحث.'
    );

    return;

  }


  /* -----------------------------------------------
     LOADING
  ------------------------------------------------ */

  document
    .getElementById('loading')
    .style.display = 'block';


  document
    .getElementById('results')
    .innerHTML = '';


  document
    .getElementById('resultsHeader')
    .style.display = 'none';


  /* -----------------------------------------------
     PARAMETERS
  ------------------------------------------------ */

  const params =
    new URLSearchParams();


  params.append(
    'action',
    'search'
  );


  params.append(
    'code',
    code
  );


  params.append(
    'category',
    category
  );


  params.append(
    'companies',
    companies.join('|')
  );


  /* -----------------------------------------------
     API REQUEST
  ------------------------------------------------ */

  fetch(
    API_URL +
    '?' +
    params.toString(),
    {
      method: 'GET',
      cache: 'no-cache'
    }
  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        'HTTP Error: ' +
        response.status
      );

    }

    return response.json();

  })

  .then(function(result) {

    document
      .getElementById('loading')
      .style.display = 'none';


    if (!result.success) {

      throw new Error(
        result.error ||
        'حدث خطأ أثناء البحث'
      );

    }


    displayResults(
      result.data || []
    );

  })

  .catch(function(error) {

    console.error(
      'Search Error:',
      error
    );


    document
      .getElementById('loading')
      .style.display = 'none';


    showMessage(
      'حدث خطأ أثناء البحث: ' +
      error.message
    );

  });

}


/* =====================================================
   DISPLAY RESULTS
===================================================== */

function displayResults(results) {

  const container =
    document.getElementById('results');


  container.innerHTML = '';


  const resultsHeader =
    document.getElementById('resultsHeader');


  resultsHeader.style.display =
    'block';


  /* -----------------------------------------------
     NO RESULTS
  ------------------------------------------------ */

  if (
    !results ||
    results.length === 0
  ) {

    resultsHeader.textContent =
      'نتائج البحث';

    showMessage(
      'لم يتم العثور على أي عامل مطابق لبيانات البحث.'
    );

    return;

  }


  /* -----------------------------------------------
     RESULTS COUNT
  ------------------------------------------------ */

  resultsHeader.textContent =
    'نتائج البحث (' +
    results.length +
    ')';


  /* -----------------------------------------------
     CREATE CARDS
  ------------------------------------------------ */

  results.forEach(function(worker) {

    const card =
      document.createElement('div');


    card.className =
      'card';


    /* -------------------------------------------
       PHOTO
    -------------------------------------------- */

    let photoHTML =
      '<div class="no-photo">لا توجد صورة</div>';


    if (worker.photo) {

      const photoURL =
        normalizePhotoURL(
          worker.photo
        );


      if (photoURL) {

        photoHTML =
          '<img src="' +
          escapeHTML(photoURL) +
          '" ' +
          'alt="Worker Photo" ' +
          'onerror="this.style.display=\'none\'">';

      }

    }


    /* -------------------------------------------
       CARD
    -------------------------------------------- */

    card.innerHTML = `

      <div class="photo-container">

        ${photoHTML}

      </div>


      <div class="card-body">

        <div class="worker-name">

          ${escapeHTML(worker.name)}

        </div>


        <div class="info-row">

          <span class="info-label">
            Code
          </span>

          <span class="info-value">
            ${escapeHTML(worker.code)}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            Company
          </span>

          <span class="info-value">
            ${escapeHTML(worker.company)}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            Job
          </span>

          <span class="info-value">
            ${escapeHTML(worker.job)}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            التصنيف
          </span>

          <span class="info-value">
            ${escapeHTML(worker.category)}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            Phone
          </span>

          <span class="info-value">
            ${escapeHTML(worker.phone)}
          </span>

        </div>

      </div>

    `;


    container.appendChild(card);

  });

}


/* =====================================================
   CLEAR SEARCH
===================================================== */

function clearSearch() {

  document
    .getElementById('code')
    .value = '';


  const companySelect =
    document.getElementById('company');


  Array
    .from(companySelect.options)
    .forEach(function(option) {

      option.selected = false;

    });


  document
    .getElementById('category')
    .value = '';


  clearResults();

}


/* =====================================================
   CLEAR RESULTS
===================================================== */

function clearResults() {

  document
    .getElementById('results')
    .innerHTML = '';


  document
    .getElementById('resultsHeader')
    .style.display = 'none';


  document
    .getElementById('loading')
    .style.display = 'none';

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(message) {

  document
    .getElementById('results')
    .innerHTML =

      '<div class="message">' +

      escapeHTML(message) +

      '</div>';

}


/* =====================================================
   NORMALIZE GOOGLE DRIVE PHOTO URL
===================================================== */

function normalizePhotoURL(url) {

  url =
    String(url || '')
      .trim();


  if (!url) {

    return '';

  }


  let match =
    url.match(
      /\/d\/([a-zA-Z0-9_-]+)/
    );


  if (!match) {

    match =
      url.match(
        /[?&]id=([a-zA-Z0-9_-]+)/
      );

  }


  if (match) {

    return (
      'https://drive.google.com/uc?export=view&id=' +
      match[1]
    );

  }


  return url;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(value || '')

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

</script>

</body>

</html>
